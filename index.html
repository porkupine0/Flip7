<title>Flip 7 Scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f4f5f9; --surface:#ffffff; --surface-2:#e7e9f1; --ink:#181b2a; --muted:#5e647d; --line:#d8dbe7;
  --accent:#e8412b; --accent-ink:#ffffff; --mint:#139e8f; --mint-bg:#dcf5f1; --gold:#b98200; --gold-bg:#fff3d1;
  --lead:#fde9e5; --bust:#b3261e; --bust-bg:#fdeceb; --err:#b3261e; --err-bg:#fdeceb;
  --shadow:0 1px 2px rgba(24,27,42,.06),0 6px 18px rgba(24,27,42,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f111b; --surface:#181b2a; --surface-2:#232739; --ink:#eff0f7; --muted:#a2a7c0; --line:#30354d;
  --accent:#ff6a4d; --accent-ink:#0f111b; --mint:#4fd6c5; --mint-bg:#123a35; --gold:#f2c14e; --gold-bg:#3a2f10;
  --lead:#3a1f1a; --bust:#ff8a80; --bust-bg:#3b1e1c; --err:#ff8a80; --err-bg:#3b1e1c;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f111b; --surface:#181b2a; --surface-2:#232739; --ink:#eff0f7; --muted:#a2a7c0; --line:#30354d;
  --accent:#ff6a4d; --accent-ink:#0f111b; --mint:#4fd6c5; --mint-bg:#123a35; --gold:#f2c14e; --gold-bg:#3a2f10;
  --lead:#3a1f1a; --bust:#ff8a80; --bust-bg:#3b1e1c; --err:#ff8a80; --err-bg:#3b1e1c;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree",system-ui,sans-serif;padding-inline:16px;padding-block:18px 48px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:800;color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:38px;height:38px;flex:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tab{padding:9px 6px;border-radius:10px;font-size:15px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
button,select{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:17px;padding:14px}
.ghost{background:transparent}
.small{padding:6px 10px;font-size:14px}
.danger{color:var(--err);border-color:var(--err)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
input[type=text],select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hint{font-size:14px;color:var(--muted);margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 12px;border-radius:999px;font-size:14px}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;font-size:22px;padding:0}
.stepper .count{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;font-weight:800;min-width:40px;text-align:center}
.names{display:flex;flex-direction:column;gap:8px}
.setrow{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.lbl{font-weight:700}

/* standings */
.players{display:flex;flex-direction:column;gap:8px}
.pl{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:2px 12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.pl.lead{background:var(--lead);border-color:var(--accent)}
.rank{font-weight:800;color:var(--muted);text-align:center;font-size:18px;grid-row:1 / 3}
.pl.lead .rank{color:var(--accent)}
.pn{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.score{font-family:"Bricolage Grotesque",sans-serif;font-size:32px;font-weight:800;text-align:right;line-height:1;grid-row:1 / 3;grid-column:3}
.gap{font-size:13px;font-weight:700;color:var(--muted)}
.pl.lead .gap{color:var(--accent)}
.meter{grid-column:1 / 4;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:6px;position:relative}
.meter span{display:block;height:100%;background:var(--accent);border-radius:4px}
.tagf{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
.tagf.hot{background:var(--mint-bg);color:var(--mint)}
.tagf.cold{background:var(--bust-bg);color:var(--bust)}

.strip{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:14px;background:var(--ink);color:var(--bg)}
.strip .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px}
.strip .meta{font-size:14px;opacity:.85}
.push{border:2px solid var(--accent);border-radius:14px;padding:14px 16px;background:var(--surface)}
.push .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;text-wrap:balance}

/* entry */
.pcard{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.pcard.bust{border-color:var(--bust)}
.pcard.flip7{border-color:var(--mint);box-shadow:0 0 0 2px var(--mint-bg)}
.phead{display:flex;align-items:baseline;gap:8px}
.phead .pn{font-size:17px}
.phead .pts{margin-left:auto;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;white-space:nowrap}
.pcard.bust .pts{color:var(--bust)}
.pcard.flip7 .pts{color:var(--mint)}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.status button{padding:9px 4px;font-size:14px}
.status button[aria-pressed="true"].s-stay{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status button[aria-pressed="true"].s-bust{background:var(--bust);color:#fff;border-color:var(--bust)}
.status button[aria-pressed="true"].s-flip7{background:var(--mint);color:#fff;border-color:var(--mint)}
.nums{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.nums button{padding:0;height:44px;font-size:18px;font-weight:800;border-radius:8px;font-variant-numeric:tabular-nums}
.nums button[aria-pressed="true"]{background:var(--surface);color:var(--accent);border:2px solid var(--accent);box-shadow:0 2px 0 var(--accent)}
.mods{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mods button{padding:0;height:40px;font-size:15px;font-weight:800;border-radius:8px}
.mods button[aria-pressed="true"]{background:var(--gold-bg);color:var(--gold);border:2px solid var(--gold)}
.calc{font-size:13px;color:var(--muted)}
.calc b{color:var(--ink)}
.switchline{display:flex;justify-content:flex-end}
.linkbtn{background:none;border:0;padding:0;color:var(--mint);font-size:13px;font-weight:700;text-decoration:underline}
.typed{display:flex;align-items:center;gap:10px}
.typed input{width:110px;text-align:center;font-size:22px;font-weight:800}
.err{background:var(--err-bg);color:var(--err);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}
.sumline{font-size:14px;font-weight:700;padding:10px 12px;border-radius:10px;background:var(--surface-2)}

/* sheet */
.tablewrap{overflow-x:auto}
table.sheet{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.sheet th,.sheet td{border-bottom:1px solid var(--line);padding:6px;text-align:center;white-space:nowrap}
.sheet thead th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.sheet td.rd{text-align:left}
.sheet td.rd button{padding:4px 10px;font-size:13px}
.c{display:inline-flex;min-width:40px;justify-content:center;padding:3px 6px;border-radius:8px;font-weight:800}
.c.bust{color:var(--bust);background:var(--bust-bg)}
.c.flip7{color:var(--mint);background:var(--mint-bg)}
.c small{font-size:10px;margin-left:2px}
.sheet tfoot td{font-weight:800;font-size:17px;border-bottom:0}
.legend{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* stats */
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aw{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.aw .an{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800}
.aw .ah{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;overflow-wrap:anywhere}
.aw .ad{font-size:13px;color:var(--muted)}
table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
table.st th,table.st td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}

<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const KEY = "flip7-scorecard-v1";
const LOGO = `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#e8412b"/><rect x="22" y="22" width="38" height="54" rx="7" fill="#1fb7a6" transform="rotate(-14 41 49)"/><rect x="38" y="20" width="40" height="58" rx="7" fill="#fff" transform="rotate(8 58 49)"/><text x="59" y="64" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="40" fill="#e8412b" transform="rotate(8 58 49)">7</text></svg>`;
const MODS = [2,4,6,8,10];
const BONUS = 15;

const blank = () => ({ count:4, names:Array(12).fill(""), firstDealer:0, target:200 });
let state = load() || { phase:"setup", setup:blank(), players:[], target:200, dealer0:0, rounds:[], tab:"game" };
let entry = null;
let confirmKey = null, confirmTimer = null;

function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, w) => `${n} ${w}${n===1?"":"s"}`;
const N = i => esc(state.players[i]);

// Official order: add number cards, double them with x2, add + modifiers, then +15 for a Flip 7. Bust = 0.
function scoreOf(e){
  if (!e || e.status === "bust") return 0;
  if (e.typed) return /^\d+$/.test(String(e.total).trim()) ? parseInt(e.total,10) : 0;
  const sum = e.nums.reduce((a,b)=>a+b,0);
  const base = e.x2 ? sum*2 : sum;
  const plus = e.mods.reduce((a,b)=>a+b,0);
  return base + plus + (e.status === "flip7" ? BONUS : 0);
}
function calcText(e){
  if (e.status === "bust") return "Busted, so this round is worth 0.";
  if (e.typed) return "Typed total.";
  const sum = e.nums.reduce((a,b)=>a+b,0), parts = [`Numbers <b>${sum}</b>`];
  if (e.x2) parts.push(`×2 = <b>${sum*2}</b>`);
  const plus = e.mods.reduce((a,b)=>a+b,0); if (plus) parts.push(`modifiers <b>+${plus}</b>`);
  if (e.status === "flip7") parts.push(`Flip 7 bonus <b>+${BONUS}</b>`);
  return parts.join(" · ");
}
function totals(k){ const t = state.players.map(()=>0); state.rounds.slice(0, k ?? state.rounds.length).forEach(r => r.forEach((e,i)=> t[i] += scoreOf(e))); return t; }
function winners(t){ const hi = Math.max(...t); if (hi < state.target) return null; const w = t.map((v,i)=>i).filter(i=>t[i]===hi); return w; }
const dealerOf = r => (state.dealer0 + r) % state.players.length;

function confirmThen(key, fn){
  if (confirmKey === key){ clearTimeout(confirmTimer); confirmKey = null; fn(); return; }
  confirmKey = key; render();
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(()=>{ confirmKey = null; render(); }, 3500);
}
let wakeLock = null;
async function keepAwake(){
  try{ if (state.phase === "play" && "wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock){
    wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
  }}catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", keepAwake);

function render(){
  const app = document.getElementById("app");
  const focusId = document.activeElement && document.activeElement.id;
  const y = window.scrollY;
  const reset = state.phase === "play" && state.tab === "game" ? `<button class="small ghost" data-act="newgame" id="newgame">${confirmKey==="new"?"Tap to confirm":"New game"}</button>` : "";
  app.innerHTML = `<div class="brand"><div class="logo">${LOGO}<h1>Flip 7</h1></div><div class="hx-hbtns">${hx.button()}${reset}</div></div>
    <div class="tabs" role="tablist"><button class="tab" role="tab" id="tab-game" data-act="tab" data-v="game" aria-selected="${state.tab==="game"}">Game</button><button class="tab" role="tab" id="tab-guide" data-act="tab" data-v="guide" aria-selected="${state.tab==="guide"}">How to play</button></div>` +
    (state.tab === "guide" ? guideView() : state.phase === "setup" ? setupView() : playView());
  if (focusId){ const el = document.getElementById(focusId); if (el) el.focus({preventScroll:true}); }
  window.scrollTo(0, y);
}

function setupView(){
  const su = state.setup;
  if (su.firstDealer >= su.count) su.firstDealer = 0;
  const opts = Array.from({length:su.count},(_,i)=>`<option value="${i}" ${i===su.firstDealer?"selected":""}>${esc((su.names[i]||"").trim()||`Player ${i+1}`)}</option>`).join("");
  return `<div class="panel">
    <div class="eyebrow">Players, in seating order going left</div>
    <div class="stepper">
      <button id="minus" data-act="count" data-d="-1" aria-label="Fewer players" ${su.count<=2?"disabled":""}>−</button>
      <span class="count num">${su.count}</span>
      <button id="plus" data-act="count" data-d="1" aria-label="More players" ${su.count>=12?"disabled":""}>+</button>
      <p class="hint grow">2 to 12 players.</p>
    </div>
    <div class="names">${Array.from({length:su.count},(_,i)=>`<input type="text" id="name-${i}" data-name="${i}" placeholder="Player ${i+1}" value="${esc(su.names[i]||"")}" maxlength="14" autocomplete="off" aria-label="Player ${i+1}">`).join("")}</div>
    <div class="setrow"><label class="lbl" for="first-dealer">First dealer</label><select id="first-dealer">${opts}</select></div>
    <div class="setrow"><span class="lbl">Play to</span>
      <div class="opts">${[100,150,200,250,300].map(v=>`<button class="opt" id="tg-${v}" data-act="target" data-v="${v}" aria-pressed="${su.target===v}">${v}</button>`).join("")}</div>
      <p class="hint">200 is the official target. Lower it for a quick game.</p></div>
  </div>
  <button class="primary" data-act="begin" id="begin">Start game</button>`;
}

function playView(){
  const n = state.rounds.length, t = totals(), has = n > 0, W = winners(t);
  const hi = Math.max(...t), T = state.target;
  const order = t.map((v,i)=>i).sort((a,b)=> t[b]-t[a] || a-b);
  const rank = i => 1 + t.filter(v => v > t[i]).length;

  let top = "";
  if (W && W.length === 1){
    top = `<div class="banner"><div class="eyebrow" style="color:inherit;opacity:.85">Game over · ${plural(n,"round")}</div>
      <h2>${N(W[0])} wins with ${t[W[0]]}</h2>
      <div class="num">${order.filter(i=>i!==W[0]).map(i=>`${N(i)} ${t[i]}`).join(" · ")}</div>
      <div style="opacity:.9">This game is saved in History.</div>
      <div class="btnrow"><button data-act="rematch" id="rematch">Rematch</button><button data-act="newsetup" id="newsetup">New players</button></div></div>`;
  } else if (W){
    top = `<div class="push"><div class="eyebrow" style="color:var(--accent)">Tie at the top</div><div class="big num">${W.map(N).join(" &amp; ")} are tied at ${hi}. Play another round to settle it.</div></div>`;
  } else if (has){
    const close = order.filter(i => T - t[i] <= 40);
    if (close.length) top = `<div class="push"><div class="eyebrow" style="color:var(--accent)">Closing in on ${T}</div><div class="big num">${close.map(i=>`${N(i)} needs ${T - t[i]}`).join(" · ")}</div></div>`;
  }
  const over = W && W.length === 1;

  const last = state.rounds[n-1];
  const players = order.map(i => {
    const lead = has && t[i] === hi;
    let gap = "";
    if (has){
      if (lead){ const others = t.filter(v=>v!==hi); gap = t.filter(v=>v===hi).length>1 ? "Tied for the lead" : others.length ? `Leads by ${hi - Math.max(...others)}` : ""; }
      else { const ahead = t.filter(v => v > t[i]), nearest = Math.min(...ahead);
        gap = `${hi - t[i]} behind the lead`;
        if (nearest !== hi){ const who = order.find(j => t[j] === nearest); gap += ` · ${nearest - t[i]} behind ${N(who)}`; } }
      if (!over && T - t[i] > 0) gap += ` · needs ${T - t[i]}`;
    }
    const lastTag = last ? (last[i].status === "flip7" ? `<span class="tagf hot">Flip 7!</span>` : last[i].status === "bust" ? `<span class="tagf cold">busted</span>` : "") : "";
    return `<div class="pl ${lead?"lead":""}"><span class="rank num">${has?rank(i):"–"}</span><span class="pn">${N(i)}${lastTag}</span><span class="score num">${t[i]}</span>${gap?`<span class="gap num">${gap}</span>`:""}
      <div class="meter" aria-hidden="true"><span style="width:${Math.min(100, t[i]/T*100)}%"></span></div></div>`;
  }).join("");

  let roundBlock = "";
  const rIdx = entry && entry.editing != null ? entry.editing : n;
  if (!over || entry){
    const d = dealerOf(rIdx);
    roundBlock = `<div class="strip"><span class="eyebrow" style="color:inherit;opacity:.7">Round ${rIdx+1}</span><span class="big">${N(d)} deals</span>
      <span class="meta">One card each, starting left of the dealer. Hit or stay, going around.</span></div>`;
    roundBlock += entry ? entryView(rIdx) : `<button class="primary" data-act="newRound" id="newRound">Score round ${n+1}</button>`;
  }
  return top + `<div class="players">${players}</div>` + roundBlock + sheetView() + statsView() +
    `<p class="hint">Every game is saved in History on this device, and the screen stays on while you play.</p>`;
}

function playerCard(i){
  const e = entry.p[i], pts = scoreOf(e);
  const status = `<div class="status" role="group" aria-label="${N(i)} result">
    <button class="s-stay" id="st-${i}-stay" data-act="status" data-i="${i}" data-v="stay" aria-pressed="${e.status==="stay"}">Stayed</button>
    <button class="s-bust" id="st-${i}-bust" data-act="status" data-i="${i}" data-v="bust" aria-pressed="${e.status==="bust"}">Busted</button>
    <button class="s-flip7" id="st-${i}-flip7" data-act="status" data-i="${i}" data-v="flip7" aria-pressed="${e.status==="flip7"}">Flip 7!</button></div>`;
  let body = "";
  if (e.status && e.status !== "bust"){
    if (e.typed){
      body = `<div class="typed"><input type="text" inputmode="numeric" id="tot-${i}" data-tot="${i}" value="${esc(e.total)}" placeholder="0" autocomplete="off" aria-label="${N(i)} round total"><span class="hint">Round total${e.status==="flip7"?", including the 15 bonus":""}</span></div>
        <div class="switchline"><button class="linkbtn" data-act="mode" data-i="${i}" id="mode-${i}">Use the card calculator</button></div>`;
    } else {
      const full = e.nums.length >= 7;
      body = `<div class="nums" role="group" aria-label="Number cards">${Array.from({length:13},(_,v)=>{ const on = e.nums.includes(v);
          return `<button id="n-${i}-${v}" data-act="num" data-i="${i}" data-v="${v}" aria-pressed="${on}" ${!on&&full?"disabled":""}>${v}</button>`; }).join("")}</div>
        <div class="mods" role="group" aria-label="Modifier cards">${MODS.map(m=>`<button id="m-${i}-${m}" data-act="mod" data-i="${i}" data-v="${m}" aria-pressed="${e.mods.includes(m)}">+${m}</button>`).join("")}
          <button id="m-${i}-x2" data-act="x2" data-i="${i}" aria-pressed="${!!e.x2}">×2</button></div>
        <div class="calc num" id="calc-${i}">${calcText(e)} ${e.nums.length?`· ${plural(e.nums.length,"number card")}`:""}</div>
        <div class="switchline"><button class="linkbtn" data-act="mode" data-i="${i}" id="mode-${i}">Just type a total</button></div>`;
    }
  }
  return `<div class="pcard ${e.status||""}"><div class="phead"><span class="pn">${N(i)}</span><span class="pts num" id="pts-${i}">${e.status?pts:"–"}</span></div>${status}${body}</div>`;
}

function entryView(rIdx){
  const np = state.players.length, d = dealerOf(rIdx);
  const order = Array.from({length:np},(_,k)=>(d+1+k)%np);
  const left = entry.p.filter(e=>!e.status).length;
  const f7 = entry.p.filter(e=>e.status==="flip7").length;
  return `<div class="panel">
    <div class="row"><h2 class="grow">${entry.editing!=null?"Edit round":"Round"} ${rIdx+1}</h2><button class="small ghost" data-act="cancel" id="cancel">Cancel</button></div>
    <p class="hint">For each player, tap how their round ended, then tap the cards they banked. The app does the ×2, modifiers and bonus. Picking 7 number cards turns it into a Flip 7.</p>
    <div style="display:flex;flex-direction:column;gap:10px">${order.map(playerCard).join("")}</div>
    <div class="sumline num">${left?`${plural(left,"player")} still to score`:"Everyone's scored."}${f7?` · ${f7>1?`${f7} Flip 7s!`:"Flip 7 ends the round for everyone."}`:""}</div>
    ${entry.error?`<div class="err">${esc(entry.error)}</div>`:""}
    <button class="primary" data-act="saveRound" id="saveRound">${entry.editing!=null?"Save changes":`Post round ${rIdx+1}`}</button>
    ${entry.editing!=null?`<button class="danger" data-act="delRound" id="delRound">${confirmKey==="del"?"Tap again to delete this round":"Delete this round"}</button>`:""}
  </div>`;
}

function sheetView(){
  const n = state.rounds.length; if (!n) return "";
  const body = state.rounds.map((r,ri) => `<tr><td class="rd"><button id="edit-${ri}" data-act="edit" data-i="${ri}" aria-label="Edit round ${ri+1}">${ri+1}</button></td>${r.map(e => {
      const pts = scoreOf(e);
      return `<td><span class="c ${e.status}">${e.status==="bust"?"✕":pts}${e.x2&&!e.typed&&e.status!=="bust"?"<small>×2</small>":""}</span></td>`; }).join("")}</tr>`).join("");
  const t = totals();
  return `<div class="panel"><div class="row"><h2 class="grow">Score sheet</h2><button class="small" data-act="undo" id="undo">${confirmKey==="undo"?"Tap to confirm":"Undo last"}</button></div>
    <div class="tablewrap"><table class="sheet"><thead><tr><th style="text-align:left">Rd</th>${state.players.map((p,i)=>`<th title="${esc(p)}">${N(i)}</th>`).join("")}</tr></thead>
    <tbody>${body}</tbody><tfoot><tr><td class="rd">Total</td>${t.map(v=>`<td class="num">${v}</td>`).join("")}</tr></tfoot></table></div>
    <div class="legend"><span><span class="c flip7">42</span> Flip 7</span><span><span class="c bust">✕</span> busted</span><span>Tap a round number to fix it</span></div></div>`;
}

function statsView(){
  const R = state.rounds, n = R.length; if (!n) return "";
  const np = state.players.length, z = () => Array(np).fill(0);
  const busts = z(), f7 = z(), stays = z(), banked = z(), best = z(), cards = z(), cardRounds = z(), x2s = z(), roundWins = z(), bustStreak = z(), bustCur = z(), zeros = z();
  let bigRound = {v:-1, list:[]};
  R.forEach((r,ri) => {
    const pts = r.map(scoreOf), m = Math.max(...pts);
    r.forEach((e,i) => {
      if (pts[i] === m && m > 0) roundWins[i]++;
      if (e.status === "bust"){ busts[i]++; bustCur[i]++; bustStreak[i] = Math.max(bustStreak[i], bustCur[i]); }
      else { bustCur[i] = 0; banked[i] += pts[i]; if (e.status === "flip7") f7[i]++; else stays[i]++; if (pts[i] === 0) zeros[i]++; }
      if (!e.typed && e.status !== "bust" && e.nums){ cards[i] += e.nums.length; cardRounds[i]++; if (e.x2) x2s[i]++; }
      best[i] = Math.max(best[i], pts[i]);
      if (pts[i] > bigRound.v) bigRound = {v:pts[i], list:[[i,ri]]}; else if (pts[i] === bigRound.v) bigRound.list.push([i,ri]);
    });
  });
  const top = arr => { const m = Math.max(...arr); return { m, who: arr.map((v,i)=>i).filter(i=>arr[i]===m) }; };
  const low = arr => { const valid = arr.map((v,i)=>[v,i]).filter(([v])=>v>=0); if (!valid.length) return {m:-1,who:[]}; const m = Math.min(...valid.map(x=>x[0])); return { m, who: valid.filter(x=>x[0]===m).map(x=>x[1]) }; };
  const pct = (a,b) => b ? Math.round(100*a/b) + "%" : "–";
  const nm = idx => [...new Set(idx)].map(N).join(", ");
  const aw = (a,b,c) => `<div class="aw"><span class="an">${a}</span><span class="ah">${b}</span><span class="ad">${c}</span></div>`;
  const bm = top(busts), fs = top(f7), bs = top(bustStreak);
  const bustRate = busts.map(b=>b/n), safe = low(bustRate);
  const avgCards = cards.map((c,i)=> cardRounds[i] ? c/cardRounds[i] : -1), dare = top(avgCards), chick = low(avgCards);
  const avgBank = banked.map((b,i)=> (n-busts[i]) ? b/(n-busts[i]) : -1), banker = top(avgBank);
  const cardsTracked = cardRounds.some(c=>c);
  const list = [
    aw("Lucky 7", fs.m?nm(fs.who):"Nobody yet", fs.m?`${plural(fs.m,"Flip 7")}`:"No Flip 7s yet"),
    aw("Big round", nm(bigRound.list.map(x=>x[0])), `${bigRound.v} points in round ${[...new Set(bigRound.list.map(x=>x[1]+1))].join(", ")}`),
    aw("Bust magnet", bm.m?nm(bm.who):"Nobody yet", bm.m?`Busted ${plural(bm.m,"time")} (${pct(bm.m,n)})`:"Nobody's busted"),
    aw("Safe hands", nm(safe.who), `Busted only ${pct(Math.round(safe.m*n), n)} of rounds`),
    aw("Cold streak", bs.m>1?nm(bs.who):"Nobody yet", bs.m>1?`${bs.m} busts in a row`:"No back-to-back busts"),
    aw("Banker", banker.m>=0?nm(banker.who):"Nobody yet", banker.m>=0?`Averages ${banker.m.toFixed(1)} when they don't bust`:""),
  ];
  if (cardsTracked){
    list.push(aw("Daredevil", nm(dare.who), `Banks ${dare.m.toFixed(1)} number cards on average`));
    list.push(aw("Plays it safe", nm(chick.who), `Stays with ${chick.m.toFixed(1)} cards on average`));
  }
  return `<div class="panel"><h2>Stats</h2><div class="hl">${list.join("")}</div>
  <div class="tablewrap"><table class="st"><thead><tr><th>Player</th><th>Won</th><th>Flip 7</th><th>Busts</th><th>Bust %</th><th>Best</th><th>Avg banked</th>${cardsTracked?"<th>Avg cards</th><th>×2</th>":""}</tr></thead>
  <tbody>${state.players.map((p,i)=>`<tr><td>${N(i)}</td><td>${roundWins[i]}</td><td>${f7[i]}</td><td>${busts[i]}</td><td>${pct(busts[i],n)}</td><td>${best[i]}</td><td>${avgBank[i]>=0?avgBank[i].toFixed(1):"–"}</td>${cardsTracked?`<td>${avgCards[i]>=0?avgCards[i].toFixed(1):"–"}</td><td>${x2s[i]}</td>`:""}</tr>`).join("")}</tbody></table></div>
  <p class="hint">Won counts rounds with the top score. Avg banked leaves out busts. Card stats come from rounds scored with the card calculator.</p></div>`;
}

function guideView(){
  return `<div class="panel guide" style="gap:14px">
    <section><h2>The idea</h2><p>Flip cards one at a time and build the biggest total you can. Every number you flip has to be different. Flip a number you already have and you bust, losing everything for the round. Stop whenever you like to bank your points. First to 200 wins.</p></section>
    <section><h3>The deck</h3>
      <ul><li><b>Number cards 0 to 12.</b> There are as many copies of each as its value: twelve 12s, eleven 11s, down to one 1, plus one 0. High numbers are worth more but show up more, so you're more likely to double up.</li>
      <li><b>Modifier cards:</b> +2, +4, +6, +8, +10, and ×2. They never cause a bust.</li>
      <li><b>Action cards:</b> Freeze, Flip Three, and Second Chance.</li></ul></section>
    <section><h3>A round, step by step</h3>
      <ol><li>The dealer deals one card face up to each player, starting on their left and ending with themselves.</li>
      <li>Going around, each player chooses to <b>hit</b> (take another card) or <b>stay</b> (bank what's in front of them and sit out the rest of the round).</li>
      <li>If you flip a number that matches one you already have, you <b>bust</b> and score 0 for the round.</li>
      <li>The round ends when everyone has stayed or busted, or when someone flips 7 different numbers.</li>
      <li>Score it here, pass the deal left, and keep the used cards out until the deck runs out.</li></ol></section>
    <section><h3>Action cards</h3>
      <dl class="rtable">
        <dt>Freeze</dt><dd>Give it to any active player, including yourself. They bank their points right now and are out for the round.</dd>
        <dt>Flip Three</dt><dd>Give it to any active player. They must take the next 3 cards, one at a time. Hard to survive with a big hand.</dd>
        <dt>Second Chance</dt><dd>Keep it. If you flip a duplicate, discard the duplicate and this card instead of busting. You can only hold one. If you get another, give it to a player who doesn't have one.</dd>
      </dl></section>
    <section><h3>Flip 7</h3><p>Collect 7 different number cards and the round ends immediately for everyone, and you score a <b>15-point bonus</b>. Everyone else still banks what they have.</p></section>
    <section><h3>Scoring, in order</h3>
      <ol><li>Add up your number cards.</li><li>If you have the ×2, double that number total. It doesn't double modifiers or the bonus.</li><li>Add your + modifiers.</li><li>Add 15 if you flipped 7.</li></ol>
      <div class="example"><span><b>Example:</b> 3, 7, 10, 12 with ×2 and +4.</span><span>Numbers: 3 + 7 + 10 + 12 = 32. Doubled: 64. Plus 4: <b>68 points</b>.</span></div>
      <p>The card calculator in the Game tab does this for you. Tap the numbers and modifiers each player banked.</p></section>
    <section><h3>Winning</h3><p>When anyone reaches 200 at the end of a round, the highest total wins. If there's a tie at the top, play another round.</p></section>
    <section><h3>Strategy tips</h3>
      <ul><li>The more numbers you hold, the more ways you can bust. Around 5 cards is where most players start to sweat.</li>
      <li>Holding high numbers is riskier than it looks, because there are so many 12s, 11s and 10s in the deck.</li>
      <li>Watch what's already been flipped. If most of the 12s are out, a 12 is a safer hold.</li>
      <li>Freeze the leader early when they have a small hand, and hand Flip Three to whoever's sitting on a big one.</li></ul></section>
  </div>`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;

  switch(act){
    case "tab": state.tab = b.dataset.v; save(); render(); window.scrollTo(0,0); break;
    case "count": su.count = Math.min(12, Math.max(2, su.count + +b.dataset.d)); save(); render(); break;
    case "target": su.target = +b.dataset.v; save(); render(); break;
    case "begin":
      state.players = Array.from({length:su.count},(_,k)=> (su.names[k]||"").trim() || `Player ${k+1}`);
      state.target = su.target; state.dealer0 = su.firstDealer; state.rounds = []; state.phase = "play"; entry = null;
      save(); render(); keepAwake(); window.scrollTo(0,0); break;
    case "newRound": openEntry(null); break;
    case "edit": openEntry(+b.dataset.i); break;
    case "cancel": entry = null; render(); break;
    case "status": { const p = entry.p[i]; p.status = b.dataset.v; if (p.status === "stay" && p.nums.length >= 7) p.status = "flip7"; entry.error = ""; render(); break; }
    case "num": { const p = entry.p[i], v = +b.dataset.v, k = p.nums.indexOf(v);
      if (k >= 0) p.nums.splice(k,1); else if (p.nums.length < 7) p.nums.push(v);

      if (p.nums.length === 7) p.status = "flip7"; else if (p.status === "flip7") p.status = "stay";
      render(); break; }
    case "mod": { const p = entry.p[i], v = +b.dataset.v, k = p.mods.indexOf(v); if (k >= 0) p.mods.splice(k,1); else p.mods.push(v); render(); break; }
    case "x2": entry.p[i].x2 = !entry.p[i].x2; render(); break;
    case "mode": { const p = entry.p[i]; p.typed = !p.typed; if (p.typed && p.total === "") p.total = String(scoreOf({...p, typed:false}) || ""); render(); document.getElementById("tot-"+i)?.focus(); break; }
    case "saveRound": {
      const miss = entry.p.findIndex(p => !p.status);
      if (miss >= 0){ entry.error = `Tap how ${state.players[miss]}'s round ended.`; render(); break; }
      const badT = entry.p.findIndex(p => p.status !== "bust" && p.typed && !/^\d+$/.test(String(p.total).trim()));
      if (badT >= 0){ entry.error = `Type a round total for ${state.players[badT]}, or switch back to the card calculator.`; render(); break; }

      if (badF >= 0){ entry.error = `${state.players[badF]} is marked Flip 7 but has ${plural(entry.p[badF].nums.length,"number card")} picked. Pick all 7, or just type their total.`; render(); break; }
      const r = entry.p.map(p => p.status === "bust" ? { status:"bust" } : p.typed ? { status:p.status, typed:true, total:String(p.total).trim() } : { status:p.status, nums:[...p.nums], mods:[...p.mods], x2:!!p.x2 });
      if (entry.editing != null) state.rounds[entry.editing] = r; else state.rounds.push(r);
      entry = null; save(); render(); window.scrollTo({top:0, behavior:"smooth"}); break;
    }
    case "delRound": confirmThen("del", ()=>{ state.rounds.splice(entry.editing,1); entry = null; save(); render(); }); break;
    case "undo": confirmThen("undo", ()=>{ state.rounds.pop(); entry = null; save(); render(); }); break;
    case "rematch": state.rounds = []; state.dealer0 = (state.dealer0 + 1) % state.players.length; entry = null; save(); render(); break;
    case "newsetup": state.phase = "setup"; state.rounds = []; entry = null; save(); render(); break;
    case "newgame": confirmThen("new", ()=>{ state.phase = "setup"; state.rounds = []; entry = null; save(); render(); }); break;
  }
});

// History adapter: how a Flip 7 game looks to the shared history module.
// Every side is one player (2 to 12). A round's points come from the app's scoreOf(); the game is over only when
// the app shows its Game over banner: someone reached the target with the single highest total (a tie plays on).
const HX = {
  app: "flip7", title: "Flip 7", unit: ["round", "rounds"], sideWord: "player", lowWins: false,
  guest: n => /^player \d+$/i.test(String(n).trim()),
  current(){
    if (state.phase !== "play" || !state.rounds.length) return null;
    const W = winners(totals()), done = !!(W && W.length === 1);
    return {
      sides: state.players.map(p => ({ name: p, players: [p] })),
      rounds: state.rounds.map(r => r.map(e => scoreOf(e))),
      done, winners: done ? W : undefined,
      note: `to ${state.target}`,
      // how each player's round ended, one string per round, one letter per player: s stayed, 7 Flip 7, x busted
      extra: { st: state.rounds.map(r => r.map(e => e && e.status === "flip7" ? "7" : e && e.status === "bust" ? "x" : "s").join("")) }
    };
  },
  // The game's stats under its scorecard, like the app's own Stats table.
  detail(g){
    const st = g.extra && g.extra.st; if (!Array.isArray(st)) return "";
    const n = (i, c) => st.filter(s => s[i] === c).length;
    const rows = g.sides.map((s,i) => {
      const won = g.rounds.filter(r => r[i] > 0 && r[i] === Math.max(...r)).length, best = Math.max(...g.rounds.map(r => r[i]));
      return `<tr><td>${esc(s.players[0] || s.name)}</td><td>${won}</td><td>${n(i, "7")}</td><td>${n(i, "x")}</td><td>${best}</td></tr>`;
    }).join("");
    return `<div class="stwrap"><table class="st"><thead><tr><th>Player</th><th>Won</th><th>Flip 7</th><th>Busts</th><th>Best</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="hint">Won counts rounds with the top score. Best is the player's biggest round.</p>`;
  },
  records(done){
    const out = [], big = [], f7 = [];
    done.forEach(g => g.sides.forEach((s,i) => {
      big.push({ g, s, v: Math.max(...g.rounds.map(r => r[i])) });
      const st = g.extra && g.extra.st; if (Array.isArray(st)) f7.push({ g, s, v: st.filter(x => x[i] === "7").length });
    }));
    const top = rows => { const m = Math.max(...rows.map(r => r.v)); return { m, who: rows.filter(r => r.v === m) }; };
    const names = w => [...new Set(w.map(r => r.s.players[0] || r.s.name))].slice(0,3).join(", ");
    const when = w => w.length === 1 ? new Date(w[0].g.date).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" }) : `${w.length} times`;
    if (big.length) { const b = top(big); out.push(["Biggest round", names(b.who), `${b.m} points · ${when(b.who)}`]); }
    if (f7.length) { const f = top(f7); if (f.m > 0) out.push(["Most Flip 7s in a game", names(f.who), `${f.m} · ${when(f.who)}`]); }
    return out;
  }
};
/* ---------- game history (shared module, same in every score app) ----------
   Every game with at least one scored round is saved to localStorage as it's played, with its date,
   the teams or players, every round's scores, the final totals and the winner. A "History" screen shows
   all-time records by player name, a game log with full scorecards, and backup / restore.
   The app supplies an adapter, HX (defined just above), and this module wraps the app's save() and render(). */
const hx = (() => {
  const HKEY = HX.app + "-history-v1", BKEY = HX.app + "-last-backup";
  const unitOne = (HX.unit || ["round", "rounds"])[0], unitMany = (HX.unit || ["round", "rounds"])[1];
  const ui = { open: false, range: "all", sel: null, game: null, all: false, msg: "", confirm: null, timer: 0 };
  const e = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = n => (n < 0 ? "−" : "") + Math.abs(n).toLocaleString("en-US");
  const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + "s")}`;
  const pkey = n => String(n || "").trim().replace(/\s+/g, " ").toLowerCase();
  const guest = n => !pkey(n) || (HX.guest ? HX.guest(n) : /^(player|partner|team|side|seat) \d+$/i.test(String(n).trim()));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const whenTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
  const dayTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); };

  // ----- storage -----
  const valid = g => !!g && typeof g.id === "string" && Array.isArray(g.sides) && g.sides.length >= 1 && g.sides.every(s => s && typeof s.name === "string" && Array.isArray(s.players))
    && Array.isArray(g.rounds) && g.rounds.every(r => Array.isArray(r) && r.length === g.sides.length && r.every(v => typeof v === "number" && isFinite(v)));
  function load() { try { const a = JSON.parse(localStorage.getItem(HKEY) || "[]"); return Array.isArray(a) ? a.filter(valid) : []; } catch (err) { return []; } }
  let games = load();
  function persist() { try { localStorage.setItem(HKEY, JSON.stringify(games)); } catch (err) { /* storage full or blocked */ } }
  const totalsOf = g => Array.isArray(g.totals) && g.totals.length === g.sides.length ? g.totals : g.sides.map((_, i) => g.rounds.reduce((s, r) => s + r[i], 0));
  function winnersOf(g) {
    if (Array.isArray(g.winners) && g.winners.length) return g.winners;
    const t = totalsOf(g), best = g.lowWins ? Math.min(...t) : Math.max(...t);
    return t.map((_, i) => i).filter(i => t[i] === best);
  }
  const isDone = g => !!g.done;

  // ----- keep the archive in step with the current game -----
  // A game is saved as soon as its first round is scored. Starting a new game (or undoing back to nothing)
  // detaches it; a game undone to nothing after one round is dropped, anything longer stays as unfinished.
  function sync() {
    if (typeof state !== "object" || !state) return;
    let cur = null;
    try { cur = HX.current(); } catch (err) { cur = null; }
    const has = cur && Array.isArray(cur.rounds) && cur.rounds.length > 0;
    const k = state.hxId ? games.findIndex(g => g.id === state.hxId) : -1;
    if (has) {
      if (!state.hxId) state.hxId = newId();
      const prev = k >= 0 ? games[k] : null;
      const g = {
        id: state.hxId, date: prev ? prev.date : new Date().toISOString(), updated: new Date().toISOString(),
        sides: cur.sides.map(s => ({ name: String(s.name || ""), players: (s.players || []).map(String) })),
        rounds: cur.rounds.map(r => r.map(v => +v || 0)),
        totals: (cur.totals || null) && cur.totals.map(v => +v || 0),
        done: !!cur.done, winners: cur.done && Array.isArray(cur.winners) ? cur.winners.slice() : undefined,
        lowWins: !!(cur.lowWins != null ? cur.lowWins : HX.lowWins), note: cur.note || "", labels: cur.labels || undefined, extra: cur.extra || undefined
      };
      if (!g.totals) delete g.totals;
      const before = prev ? JSON.stringify(Object.assign({}, prev, { updated: 0 })) : "";
      if (before === JSON.stringify(Object.assign({}, g, { updated: 0 }))) return;
      if (k >= 0) games[k] = g; else games.push(g);
      persist();
    } else if (state.hxId) {
      // games with no game-over of their own end when the app says so (New game): the best total wins
      let ended = false;
      try { ended = typeof HX.ended === "function" && !!HX.ended(); } catch (err) { ended = false; }
      if (k >= 0 && !games[k].done && ended) {
        const g = games[k], t = g.totals || g.sides.map((_, i) => g.rounds.reduce((a, r) => a + (+r[i] || 0), 0));
        const best = g.lowWins ? Math.min(...t) : Math.max(...t);
        g.done = true; g.winners = t.map((_, i) => i).filter(i => t[i] === best); g.updated = new Date().toISOString();
        persist();
      } else if (k >= 0 && !games[k].done && games[k].rounds.length <= 1) { games.splice(k, 1); persist(); }
      state.hxId = null;
    }
  }

  // ----- stats -----
  const byDate = () => games.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  function inRange(g) {
    if (ui.range === "all") return true;
    const d = new Date(g.date);
    if (isNaN(d)) return false;
    if (ui.range[0] === "y") return d.getFullYear() === +ui.range.slice(1);
    return Date.now() - d <= +ui.range.slice(1) * 864e5;
  }
  const rangeLabel = () => ui.range === "all" ? "all time" : ui.range[0] === "y" ? ui.range.slice(1) : `the last ${ui.range.slice(1)} days`;
  function sideLabel(s) {
    const named = s.players.filter(p => !guest(p));
    if (s.players.length > 1) return guest(s.name) || !s.name ? (named.length ? s.players.join(" & ") : s.name || "Team") : `${s.name} (${s.players.join(" & ")})`;
    return s.players[0] || s.name;
  }
  function shortLabel(s) {
    if (s.players.length > 1) return guest(s.name) || !s.name ? s.players.join(" & ") : s.name;
    return s.players[0] || s.name;
  }
  function career(list) {
    const map = new Map(), pairs = new Map();
    list.filter(isDone).forEach(g => {
      const t = totalsOf(g), w = winnersOf(g);
      g.sides.forEach((s, i) => {
        const won = w.includes(i);
        s.players.forEach(name => {
          if (guest(name)) return;
          const k = pkey(name);
          let p = map.get(k);
          if (!p) { p = { k, name: "", gp: 0, wins: 0, shared: 0, sum: 0, best: null, worst: null, streak: 0, bestStreak: 0 }; map.set(k, p); }
          p.name = String(name).trim();
          p.gp++; p.sum += t[i];
          const better = (a, b) => g.lowWins ? a < b : a > b;
          if (p.best == null || better(t[i], p.best)) p.best = t[i];
          if (p.worst == null || better(p.worst, t[i])) p.worst = t[i];
          if (won) { p.wins++; if (w.length > 1) p.shared++; p.streak++; p.bestStreak = Math.max(p.bestStreak, p.streak); } else p.streak = 0;
        });
        const named = s.players.filter(n => !guest(n));
        if (s.players.length === 2 && named.length === 2) {
          const pk = named.map(pkey).sort().join("|");
          const r = pairs.get(pk) || { names: named.map(n => String(n).trim()).sort((a, b) => a.localeCompare(b)), gp: 0, wins: 0 };
          r.gp++; if (won) r.wins++;
          pairs.set(pk, r);
        }
      });
    });
    const players = [...map.values()].sort((a, b) => b.wins - a.wins || b.wins / b.gp - a.wins / a.gp || a.name.localeCompare(b.name));
    const teams = [...pairs.values()].sort((a, b) => b.wins - a.wins || b.gp - a.gp || a.names.join().localeCompare(b.names.join()));
    return { players, teams };
  }
  const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
  const avg = (a, b) => b ? num(Math.round(a / b)) : "–";

  // ----- views -----
  function button() { return `<button class="small ghost" data-hx="open" id="hx-open" type="button">History</button>`; }
  function note() { return `<p class="hint">Saved in History with today's date.</p>`; }
  function unbacked() { let at = 0; try { at = +localStorage.getItem(BKEY) || 0; } catch (err) { /* ignore */ } return games.filter(isDone).length - at; }
  function award(t, w, d) { return `<div class="hx-award"><span class="hx-an">${t}</span><span class="hx-aw">${w}</span><span class="hx-ad">${d}</span></div>`; }

  function recordsView(done, stats) {
    if (!done.length) return "";
    const items = [];
    const scores = [], margins = [];
    done.forEach(g => {
      const t = totalsOf(g), w = winnersOf(g);
      g.sides.forEach((s, i) => scores.push({ v: t[i], who: sideLabel(s), g }));
      if (w.length === 1 && g.sides.length > 1) {
        const others = t.filter((_, i) => i !== w[0]);
        const runner = g.lowWins ? Math.min(...others) : Math.max(...others);
        margins.push({ v: Math.abs(t[w[0]] - runner), who: sideLabel(g.sides[w[0]]), g });
      }
    });
    const pick = (list, hi) => { const m = hi ? Math.max(...list.map(x => x.v)) : Math.min(...list.map(x => x.v)); return { m, who: list.filter(x => x.v === m) }; };
    const names = who => e([...new Set(who.map(x => x.who))].slice(0, 3).join(", ")) + (new Set(who.map(x => x.who)).size > 3 ? "…" : "");
    const when = who => who.length === 1 ? dayTxt(who[0].g.date) : `${who.length} times`;
    const lowWins = done.every(g => g.lowWins);
    const best = pick(scores, !lowWins), worst = pick(scores, lowWins);
    items.push(award(lowWins ? "Lowest score" : "Highest score", names(best.who), `${num(best.m)} · ${when(best.who)}`));
    items.push(award(lowWins ? "Highest score" : "Lowest score", names(worst.who), `${num(worst.m)} · ${when(worst.who)}`));
    if (margins.length) { const mg = pick(margins, true); items.push(award("Biggest win", names(mg.who), `By ${num(mg.m)} · ${when(mg.who)}`)); }
    const most = f => stats.players.length ? Math.max(...stats.players.map(p => p[f])) : 0;
    const whoOf = (m, f) => e(stats.players.filter(p => p[f] === m).map(p => p.name).slice(0, 3).join(", "));
    const mw = most("wins"), ms = most("bestStreak"), mg2 = most("gp");
    if (stats.players.length) {
      items.push(award("Most wins", mw ? whoOf(mw, "wins") : "–", plural(mw, "win")));
      items.push(award("Longest win streak", ms ? whoOf(ms, "bestStreak") : "–", `${ms} in a row`));
      items.push(award("Most games", whoOf(mg2, "gp"), plural(mg2, "game")));
    }
    if (HX.records) { try { (HX.records(done) || []).forEach(r => items.push(award(e(r[0]), e(r[1]), e(r[2])))); } catch (err) { /* adapter records are optional */ } }
    return `<div class="panel"><h2>Records</h2><div class="hx-awards">${items.join("")}</div></div>`;
  }

  function scorecard(g) {
    const t = totalsOf(g), w = winnersOf(g), run = g.sides.map(() => 0);
    const head = `<tr><th>${e(unitOne[0].toUpperCase() + unitOne.slice(1))}</th>${g.sides.map((s, i) => `<th class="${g.done && w.includes(i) ? "hx-won" : ""}">${e(shortLabel(s))}</th>`).join("")}</tr>`;
    const body = g.rounds.map((r, ri) => {
      r.forEach((v, i) => { run[i] += v; });
      const label = g.labels && g.labels[ri] ? g.labels[ri] : String(ri + 1);
      return `<tr><td>${e(label)}</td>${r.map((v, i) => `<td>${num(v)}${g.rounds.length > 1 ? `<span class="hx-run">${num(run[i])}</span>` : ""}</td>`).join("")}</tr>`;
    }).join("");
    const foot = `<tr class="hx-tot"><td>Total</td>${t.map((v, i) => `<td class="${g.done && w.includes(i) ? "hx-won" : ""}">${num(v)}</td>`).join("")}</tr>`;
    let more = "";
    if (HX.detail) { try { more = HX.detail(g) || ""; } catch (err) { more = ""; } }
    return `<div class="hx-card"><div class="stwrap hx-wrap"><table class="st hx-sc"><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div>${g.rounds.length > 1 ? `<p class="hint">Small numbers are running totals.</p>` : ""}${more}</div>`;
  }

  function logView(list, sel) {
    let rows = list.slice().reverse();
    if (sel) rows = rows.filter(g => g.sides.some(s => s.players.some(n => pkey(n) === sel.k)));
    if (!rows.length) return "";
    const shown = ui.all ? rows : rows.slice(0, 10);
    const items = shown.map(g => {
      const t = totalsOf(g), w = winnersOf(g);
      const order = t.map((_, i) => i).sort((a, b) => (g.lowWins ? t[a] - t[b] : t[b] - t[a]) || a - b);
      const current = g.id === state.hxId;
      const lead = w.map(i => e(sideLabel(g.sides[i]))).join(" &amp; ");
      let status;
      if (g.done) {
        const others = t.filter((_, i) => !w.includes(i));
        const runner = others.length ? (g.lowWins ? Math.min(...others) : Math.max(...others)) : null;
        status = w.length > 1 ? `${lead} tied` : `${lead} won${runner != null ? ` by ${num(Math.abs(t[w[0]] - runner))}` : ""}`;
      } else status = `<span class="hx-tag">${current ? "In progress" : "Unfinished"}</span> after ${plural(g.rounds.length, unitOne, unitMany)}`;
      const open = ui.game === g.id, del = "del-" + g.id;
      return `<div class="hx-game">
        <div class="hx-meta"><b>${e(whenTxt(g.date))}</b><span class="hint">${status}${g.note ? ` · ${e(g.note)}` : ""}</span></div>
        <div class="hx-scores num">${order.map(i => `<span class="${g.done && w.includes(i) ? "hx-win" : ""}">${e(sideLabel(g.sides[i]))} <b>${num(t[i])}</b></span>`).join(" · ")}</div>
        <div class="btnrow hx-btns"><button class="small" type="button" data-hx="game" data-id="${e(g.id)}" id="hx-g-${e(g.id)}">${open ? "Hide scorecard" : "Scorecard"}</button>${current ? "" : `<button class="small danger" type="button" data-hx="del" data-id="${e(g.id)}" id="hx-d-${e(g.id)}">${ui.confirm === del ? "Tap to delete" : "Delete"}</button>`}</div>
        ${open ? scorecard(g) : ""}
      </div>`;
    }).join("");
    return `<div class="panel"><h2>${sel ? `${e(sel.name)}'s games` : "Game log"}</h2><div class="hx-log">${items}</div>
      ${rows.length > 10 ? `<button class="small" type="button" data-hx="all" id="hx-all">${ui.all ? "Show fewer" : `Show all ${rows.length} games`}</button>` : ""}</div>`;
  }

  function backupView() {
    return `<div class="panel"><h2>Backup &amp; share</h2>
      <p class="hint">History is stored on this phone only. Clearing site data or switching phones loses it, so back it up now and then.</p>
      <p class="hint">To combine two phones' history, share the backup to the other phone and tap Restore there. Games it already has are skipped.</p>
      <div class="btnrow"><button type="button" data-hx="share" id="hx-share" ${games.length ? "" : "disabled"}>Share backup</button><button type="button" data-hx="download" id="hx-download" ${games.length ? "" : "disabled"}>Download</button><button type="button" data-hx="restore" id="hx-restore">Restore</button></div>
      <input type="file" id="hx-file" accept=".json,application/json" hidden>
      ${ui.msg ? `<p class="hint" role="status">${e(ui.msg)}</p>` : ""}</div>`;
  }

  function view() {
    const back = `<button class="small ghost" type="button" data-hx="back" id="hx-back">Back</button>`;
    const top = `<div class="hx-top"><div><div class="eyebrow">${e(HX.title)}</div><h1>History</h1></div>${back}</div>`;
    if (!games.length) return `<div class="hx">${top}<div class="panel"><h2>No games yet</h2><p class="hint">Every game is saved here as you play, with the date, the ${HX.sideWord || "team"}s and every ${unitOne}'s score.</p></div>${backupView()}</div>`;
    const list = byDate().filter(inRange), stats = career(list), done = list.filter(isDone);
    const sel = ui.sel && stats.players.find(p => p.k === ui.sel);
    const years = [...new Set(games.map(g => new Date(g.date).getFullYear()).filter(y => !isNaN(y)))].sort((a, b) => b - a);
    const opt = (v, l) => `<option value="${v}" ${ui.range === v ? "selected" : ""}>${l}</option>`;
    const range = `<div class="row"><label class="eyebrow" for="hx-range">Showing</label><select id="hx-range" class="grow">${opt("all", "All time")}${opt("d30", "Last 30 days")}${opt("d90", "Last 90 days")}${years.map(y => opt("y" + y, y)).join("")}</select></div>`;
    const nudge = unbacked() >= 5 ? `<div class="hx-nudge"><span class="grow">${plural(unbacked(), "finished game")} since your last backup.</span><button class="small" type="button" data-hx="download" id="hx-nudge">Back up now</button></div>` : "";
    let body;
    if (sel) {
      body = `<div class="panel"><div class="row"><h2 class="grow">${e(sel.name)}</h2><button class="small" type="button" data-hx="player" data-k="" id="hx-everyone">Everyone</button></div>
        <div class="hx-awards">${award("Games", sel.gp, `in ${rangeLabel()}`)}${award("Wins", sel.wins, `${pct(sel.wins, sel.gp)} of games${sel.shared ? `, ${sel.shared} shared` : ""}`)}${award(done.every(g => g.lowWins) ? "Best (lowest)" : "Best score", sel.best == null ? "–" : num(sel.best), "single game")}${award("Average", avg(sel.sum, sel.gp), "per game")}${award("Best streak", sel.bestStreak, "wins in a row")}</div></div>`;
    } else if (!done.length) {
      body = `<div class="panel"><h2>All-time records</h2><p class="hint">No finished games in ${rangeLabel()} yet. Unfinished games are listed below.</p></div>`;
    } else {
      const pl = stats.players, tm = stats.teams;
      body = `<div class="panel"><div><h2>Players</h2><p class="hint">${plural(done.length, "finished game")} in ${rangeLabel()}. Tap a name for their record and games.</p></div>
        ${pl.length ? `<div class="stwrap"><table class="st"><thead><tr><th>Player</th><th>GP</th><th>Wins</th><th>Win %</th><th>Avg</th><th>Best</th></tr></thead><tbody>
          ${pl.map(p => `<tr><td><button class="hx-link" type="button" data-hx="player" data-k="${e(p.k)}">${e(p.name)}</button></td><td>${p.gp}</td><td>${p.wins}</td><td>${pct(p.wins, p.gp)}</td><td>${avg(p.sum, p.gp)}</td><td>${p.best == null ? "–" : num(p.best)}</td></tr>`).join("")}
        </tbody></table></div><p class="hint">GP: games played. Wins include ties. Avg and Best are ${HX.sideWord === "player" ? "the player's" : "the team's"} final score.</p>`
        : `<p class="hint">Only unnamed players so far. Name everyone at the start of a game to track them here.</p>`}</div>
        ${tm.length ? `<div class="panel"><h2>Partnerships</h2><div class="stwrap"><table class="st"><thead><tr><th>Pair</th><th>GP</th><th>Wins</th><th>Win %</th></tr></thead><tbody>${tm.map(r => `<tr><td>${e(r.names.join(" & "))}</td><td>${r.gp}</td><td>${r.wins}</td><td>${pct(r.wins, r.gp)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
        ${recordsView(done, stats)}`;
    }
    return `<div class="hx">${top}${nudge}${range}${body}${logView(list, sel)}${backupView()}</div>`;
  }

  // ----- backup -----
  function file() {
    const data = JSON.stringify({ app: HX.app, version: 1, exported: new Date().toISOString(), games }, null, 2);
    return new File([data], `${HX.app}-history-${new Date().toISOString().slice(0, 10)}.json`, { type: "application/json" });
  }
  function marked() { try { localStorage.setItem(BKEY, String(games.filter(isDone).length)); } catch (err) { /* ignore */ } }
  function download() {
    const f = file(), a = document.createElement("a");
    a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    marked(); ui.msg = `Downloaded ${f.name}.`;
  }
  async function share() {
    const f = file();
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f], title: `${HX.title} history` }); marked(); ui.msg = "Backup shared."; }
      catch (err) { if (err.name !== "AbortError") ui.msg = "Couldn't share. Try Download instead."; }
    } else { download(); ui.msg += " This browser can't share files, so it was downloaded instead."; }
  }
  function restore(text) {
    let data;
    try { data = JSON.parse(text); } catch (err) { ui.msg = `That file isn't a ${HX.title} backup.`; return; }
    const list = Array.isArray(data) ? data : data && Array.isArray(data.games) && (!data.app || data.app === HX.app) ? data.games : null;
    if (!list) { ui.msg = `That file isn't a ${HX.title} backup.`; return; }
    let added = 0, updated = 0, skipped = 0, bad = 0;
    list.forEach(g => {
      if (!valid(g)) { bad++; return; }
      const k = games.findIndex(x => x.id === g.id);
      const copy = JSON.parse(JSON.stringify(g));
      if (isNaN(new Date(copy.date))) copy.date = new Date().toISOString();
      if (k < 0) { games.push(copy); added++; }
      else if (g.id !== state.hxId && (g.done && !games[k].done || g.rounds.length > games[k].rounds.length)) { games[k] = copy; updated++; }
      else skipped++;
    });
    persist();
    ui.msg = `Added ${plural(added, "game")}.` + (updated ? ` Updated ${updated}.` : "") + (skipped ? ` ${skipped} already here.` : "") + (bad ? ` ${bad} unreadable.` : "");
  }

  // ----- events -----
  function confirmThen(key, fn) {
    if (ui.confirm === key) { clearTimeout(ui.timer); ui.confirm = null; fn(); return; }
    ui.confirm = key; render();
    clearTimeout(ui.timer);
    ui.timer = setTimeout(() => { ui.confirm = null; if (ui.open) render(); }, 3500);
  }
  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-hx]"); if (!b) return;
    const a = b.dataset.hx;
    if (a === "open") { ui.open = true; ui.msg = ""; render(); window.scrollTo(0, 0); }
    else if (a === "back") { ui.open = false; ui.sel = null; ui.game = null; render(); window.scrollTo(0, 0); }
    else if (a === "game") { ui.game = ui.game === b.dataset.id ? null : b.dataset.id; render(); }
    else if (a === "del") confirmThen("del-" + b.dataset.id, () => { games = games.filter(g => g.id !== b.dataset.id); persist(); render(); });
    else if (a === "all") { ui.all = !ui.all; render(); }
    else if (a === "player") { ui.sel = b.dataset.k || null; ui.all = false; render(); window.scrollTo(0, 0); }
    else if (a === "download") { download(); render(); }
    else if (a === "share") share().then(render);
    else if (a === "restore") { const f = document.getElementById("hx-file"); if (f) f.click(); }
  });
  document.addEventListener("change", ev => {
    if (ev.target.id === "hx-range") { ui.range = ev.target.value; ui.sel = null; render(); }
    if (ev.target.id === "hx-file" && ev.target.files && ev.target.files[0]) ev.target.files[0].text().then(restore, () => { ui.msg = "Couldn't read that file."; }).then(render);
  });

  return { sync, view, button, note, isOpen: () => ui.open, games: () => games };
})();
// Wrap the app's own save() and render(): every save keeps the archive current, and History takes over the screen while open.
{
  const appSave = save, appRender = render;
  save = function () { hx.sync(); return appSave.apply(this, arguments); };
  render = function () {
    if (hx.isOpen()) { document.getElementById("app").innerHTML = hx.view(); return; }
    return appRender.apply(this, arguments);
  };
}
// A game already on this phone when History arrived is saved right away (dated now).
hx.sync(); save();
/* hx:js:end */
render();
keepAwake();
</script>
</body>
</html>
